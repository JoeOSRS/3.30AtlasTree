<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Tree Filter</title>
<style>
:root{
  --bg:#07090f; --panel:#11141c; --panel2:#181c26; --line:#2a2f3c; --text:#d9d2c0; --muted:#8c8573;
  --gold:#c8a24a; --gold2:#e9cf86; --blue:#7fa6e0; --red:#c25a4a; --green:#7cbf6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
#top{position:fixed;inset:0 0 auto 0;height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.tab{background:none;border:0;padding:6px 8px;color:var(--muted);cursor:pointer;border-radius:4px}
.tab.on{color:var(--gold2)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.on{border-color:var(--gold);color:var(--gold2)}
#search{background:#0b0e15;border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:220px;min-width:0}
#search:focus{outline:none;border-color:var(--gold)}
#scount{color:var(--muted);min-width:44px}
.sp{flex:1}
#points{padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:#0b0e15;cursor:pointer}
#points:hover,#points.on{border-color:var(--gold)}
#sel{position:fixed;top:40px;right:0;bottom:0;width:340px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;transition:transform .15s}
#sel.closed{transform:translateX(100%)}
#sel .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#sel .hd b{color:var(--gold2)}
#sel .body{overflow:auto;flex:1;padding-bottom:16px}
#sel h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:12px 12px 4px;display:flex;justify-content:space-between;gap:8px}
#sel h3 span{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
#sel .fx{padding:4px 12px;color:#8f9bff;border-bottom:1px solid #1d212b}
#sel .fx i{color:var(--muted);font-style:normal;font-size:11px;margin-left:4px}
#sel .nd{display:flex;align-items:center;gap:6px;padding:2px 12px;cursor:pointer}
#sel .nd:hover{background:var(--panel2)}
#sel .nd .nm{flex:1}
#sel .nd .k{color:var(--muted);font-size:11px}
#sel .nd button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:3px;width:20px;height:20px;line-height:1;padding:0;cursor:pointer}
#sel .nd button:hover{color:var(--red);border-color:var(--red)}
#sel .empty{padding:16px 12px;color:var(--muted)}
#sel .tabs{display:flex;gap:4px;padding:8px 12px 0}
#points b{color:var(--gold2)}
#points.over b{color:var(--red)}
#side{position:fixed;top:40px;left:0;bottom:0;width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:4;transition:transform .15s}
#side.closed{transform:translateX(-270px)}
#side h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:12px 12px 6px}
.row{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:7px;padding:3px 12px;color:var(--muted);cursor:pointer;user-select:none}
.opt input{accent-color:var(--gold)}
#cats{overflow:auto;flex:1;padding:4px 0 12px;border-top:1px solid var(--line)}
.cat{display:flex;align-items:center;gap:8px;padding:3px 12px;cursor:pointer;user-select:none}
.cat:hover{background:var(--panel2)}
.cat input{accent-color:var(--gold);margin:0}
.cat .ico{width:22px;height:22px;flex:none;background-repeat:no-repeat;border-radius:50%}
.cat .nm{flex:1}
.cat .n{color:var(--muted);font-size:11px}
.cat .a{color:var(--gold);font-size:11px}
.cat input.hl{accent-color:#3fc8e8}
.cat.mark .nm{color:#7fe0f5}
.cols{display:flex;gap:8px;padding:4px 12px 0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cols span{width:13px;text-align:center}
.cat.off .nm{color:var(--muted);text-decoration:line-through}
#toggle{position:fixed;top:48px;left:278px;z-index:4;transition:left .15s}
#side.closed + #toggle{left:8px}
canvas{position:fixed;top:40px;left:0;display:block;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
#tip{position:fixed;pointer-events:none;z-index:9;max-width:380px;background:rgba(8,8,10,.96);border:1px solid #5b4a2a;border-radius:3px;display:none;box-shadow:0 6px 20px #000a}
#tip .h{padding:6px 10px;text-align:center;font-weight:600;color:#e2d3a6;background:linear-gradient(#2a2216,#17130c);border-bottom:1px solid #5b4a2a}
#tip .h.notable{color:#f0d070}#tip .h.keystone{color:#f2b65c}#tip .h.wormhole{color:#b9a0f0}
#tip .b{padding:7px 11px;color:#8888ff;white-space:pre-line}
#tip .v{border-top:1px dashed #333;padding-top:4px;margin-top:4px}
#tip .v.chosen{color:#cfe3ff;background:rgba(63,120,232,.18)}
#tip .v.off{opacity:.45}
#pick{position:fixed;z-index:11;background:var(--panel);border:1px solid var(--gold);border-radius:4px;box-shadow:0 8px 24px #000c;max-width:340px;display:none}
#pick .ph{padding:7px 10px;color:var(--gold2);font-weight:600;border-bottom:1px solid var(--line)}
#pick button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #1d212b;padding:6px 10px;color:#8f9bff;cursor:pointer}
#pick button:hover,#pick button.on{background:var(--panel2);color:#cfe3ff}
#pick button.later{color:var(--muted);border-bottom:0}
#sel .ch{padding:6px 12px;border-bottom:1px solid #1d212b}
#sel .ch .cn{color:var(--text);margin-bottom:4px}
#sel .ch .cn i{color:var(--red);font-style:normal;font-size:11px;margin-left:6px}
#sel .ch button{display:block;width:100%;text-align:left;margin:2px 0;padding:3px 7px;background:#0b0e15;border:1px solid var(--line);border-radius:3px;color:#8f9bff;cursor:pointer;font-size:12px}
#sel .ch button.on{border-color:#3f78e8;background:rgba(63,120,232,.18);color:#cfe3ff}
#tip .r{color:#7f7f7f;font-style:italic;font-size:12px;padding:0 11px 6px;white-space:pre-line}
#tip .f{color:#af6025;font-style:italic;padding:0 11px 7px;white-space:pre-line}
#tip .c{padding:4px 11px;font-size:11px;color:var(--muted);border-top:1px solid #222}
#tip .c b{color:var(--gold)}
#hint{position:fixed;right:10px;bottom:10px;color:var(--muted);font-size:11px;z-index:3;text-align:right;pointer-events:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:8px 14px;border-radius:4px;display:none;z-index:10}
@media (max-width:760px){
  #side{width:240px}#side.closed{transform:translateX(-240px)}#toggle{left:248px}
  #search{width:110px}.wide{display:none}
}
</style>
</head>
<body>
<div id="top">
  <button class="tab on" data-tree="normal">Atlas Tree</button>
  <button class="tab" data-tree="ruthless">Ruthless</button>
  <input id="search" placeholder="Search nodes" autocomplete="off">
  <span id="scount"></span>
  <span class="sp"></span>
  <button class="btn" id="zout" title="Zoom out">−</button>
  <button class="btn" id="zin" title="Zoom in">+</button>
  <button class="btn" id="fit">Fit</button>
  <button class="btn on wide" id="bgbtn">Background</button>
  <button class="btn wide" id="share" title="Copy a link with your allocated nodes and filters">Share</button>
  <button class="btn wide" id="exp" title="Download allocated nodes as a .build file">Export</button>
  <button class="btn wide" id="imp" title="Load a .build / .json file">Import</button>
  <button class="btn" id="reset" title="Unallocate everything">Reset</button>
  <button id="points" title="Show the selected-nodes summary">Selected <b>0</b> / 150</button>
</div>
<div id="side">
  <h2>Content filter</h2>
  <div class="row">
    <button class="btn" id="all">Show all</button>
    <button class="btn" id="none">Hide all</button>
    <button class="btn" id="invert">Invert</button>
    <button class="btn" id="clearMarks" title="Remove all highlights">Clear highlights</button>
  </div>
  <label class="opt"><input type="checkbox" id="optDim"> Dim hidden nodes instead of removing</label>
  <label class="opt" title="Generic travel nodes (Map Drop Chance, Pack Size, Item Rarity, Thread Drop Chance...) that become dead ends once their content is hidden are hidden too"><input type="checkbox" id="optPrune" checked> Hide dead-end paths into hidden content</label>
  <label class="opt" title="Also hide nodes from other clusters that mention a hidden content type, e.g. 'Exotic Repositories' (Strongboxes) mentions Mercenaries"><input type="checkbox" id="optStrict"> Include nodes that mention it (hide &amp; highlight)</label>
  <label class="opt" title="When something is highlighted, fade every node that isn't"><input type="checkbox" id="optFade"> Fade non-highlighted nodes</label>
  <h2>Content types</h2>
  <div class="cols"><span title="Show">👁</span><span title="Highlight">★</span></div>
  <div id="cats"></div>
</div>
<button class="btn" id="toggle" title="Toggle filter panel">☰</button>
<canvas id="cv"></canvas>
<div id="tip"></div>
<div id="sel" class="closed">
  <div class="hd"><span id="selCount"></span><span class="sp"></span><button class="btn" id="selClear">Clear</button><button class="btn" id="selClose" title="Close">✕</button></div>
  <div class="tabs"><button class="btn on" data-mode="cat">By content</button><button class="btn" data-mode="all">All effects</button></div>
  <div class="body" id="selBody"></div>
</div>
<div id="hint">Drag to pan · wheel to zoom · click a node to allocate a path · click an allocated node to remove it</div>
<div id="toast"></div>
<div id="pick"></div>
<input type="file" id="file" accept=".build,.json" hidden>
<script src="data.js"></script>
<script>
(() => {
'use strict';
const ATLAS = window.ATLAS;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const store = { get(k){ try { return JSON.parse(localStorage.getItem('atlasFilter.' + k)); } catch { return null; } },
                set(k, v){ try { localStorage.setItem('atlasFilter.' + k, JSON.stringify(v)); } catch {} } };

// ---------- images ----------
const IMG = {};
function img(file){
  if (!IMG[file]) { const i = new Image(); i.onload = requestDraw; i.src = 'assets/' + file; IMG[file] = i; }
  return IMG[file];
}

// ---------- state ----------
let T, treeName = 'normal';           // current tree data
let hiddenCats = new Set(store.get('hidden') || []);
let markCats = new Set(store.get('marked') || []);
let opts = Object.assign({ dim:false, prune:true, strict:false, bg:true, fade:false }, store.get('opts') || {});
let alloc = new Set();
let choices = {};                     // choice node id -> picked option index                // allocated node ids (start excluded)
let hidden = new Set();               // effective hidden node ids
let adj = {};                         // id -> [ids] (no masteries)
let hover = null, previewPath = null, searchHits = [], searchIdx = -1;
const cam = { x: 0, y: 0, s: 0.05 };
let W = 0, H = 0, dpr = 1;

const TRAVEL = new Set(['General', 'Threads', 'Magic Monsters', 'Rare Monsters', 'Maps']);
const NOT_FILTERABLE = new Set(['Start']);

function loadTree(name, keepAlloc){
  treeName = name; T = ATLAS[name];
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tree === name));
  adj = {};
  const N = T.nodes;
  T.list = Object.values(N);
  T.start = T.list.find(n => n.t === 'start');
  for (const n of T.list) adj[n.id] = [];
  T.edges = [];
  const seen = new Set();
  for (const n of T.list) {
    if (n.t === 'mastery') continue;
    for (const o of n.out.concat(n.in)) {
      const m = N[o]; if (!m || m.t === 'mastery') continue;
      const key = n.id < o ? n.id + '-' + o : o + '-' + n.id;
      if (seen.has(key)) continue; seen.add(key);
      adj[n.id].push(o); adj[o].push(n.id);
      T.edges.push([n, m, (n.arc && n.arc[o]) || (m.arc && m.arc[n.id]) || null]);
    }
  }
  // gateway pairs: same name connect to each other (pathing only)
  const gw = {};
  for (const n of T.list) if (n.t === 'wormhole') (gw[n.n] = gw[n.n] || []).push(n.id);
  T.gate = {};
  for (const k in gw) if (gw[k].length === 2) { T.gate[gw[k][0]] = gw[k][1]; T.gate[gw[k][1]] = gw[k][0]; }
  // groups -> nodes, mastery -> its cluster
  T.groupNodes = {};
  for (const n of T.list) (T.groupNodes[n.g] = T.groupNodes[n.g] || []).push(n);
  // bounds of the visible tree
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const n of T.list) { x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); }
  T.box = [x0,y0,x1,y1];
  if (!keepAlloc) alloc = new Set();
  else alloc = new Set([...alloc].filter(id => N[id]));
  buildCats();
  recompute();
}

// ---------- categories ----------
function masteryIconFor(cat){
  const m = T.list.find(n => n.t === 'mastery' && n.cat === cat);
  return m ? m.ic : null;
}
function buildCats(){
  const counts = {}, allocCounts = {};
  for (const n of T.list) {
    if (n.t === 'mastery' || NOT_FILTERABLE.has(n.cat)) continue;
    counts[n.cat] = (counts[n.cat] || 0) + 1;
    if (alloc.has(n.id)) allocCounts[n.cat] = (allocCounts[n.cat] || 0) + 1;
  }
  const names = Object.keys(counts).sort((a, b) => {
    const sa = a === 'General' || a === 'Gateways', sb = b === 'General' || b === 'Gateways';
    return sa === sb ? a.localeCompare(b) : sa ? 1 : -1;
  });
  const box = $('cats'); box.innerHTML = '';
  const sp = T.sprites.mastery, sheet = 'assets/' + sp.file;
  for (const c of names) {
    const el = document.createElement('label');
    el.className = 'cat' + (hiddenCats.has(c) ? ' off' : '') + (markCats.has(c) ? ' mark' : '');
    const ic = masteryIconFor(c), co = ic && sp.coords[ic];
    const icoStyle = co ? `background-image:url(${sheet});background-size:${22 / co.w * sp.w}px auto;background-position:-${co.x * 22 / co.w}px -${co.y * 22 / co.h}px` : 'background:#222';
    el.innerHTML = `<input type="checkbox" title="Show" ${hiddenCats.has(c) ? '' : 'checked'}><input type="checkbox" class="hl" title="Highlight" ${markCats.has(c) ? 'checked' : ''}><span class="ico" style="${icoStyle}"></span><span class="nm"></span>` +
      `<span class="a">${allocCounts[c] ? allocCounts[c] + ' ✓' : ''}</span><span class="n">${counts[c]}</span>`;
    el.querySelector('.nm').textContent = c;
    el.querySelector('input.hl').addEventListener('change', e => {
      e.target.checked ? markCats.add(c) : markCats.delete(c);
      el.classList.toggle('mark', e.target.checked);
      store.set('marked', [...markCats]); requestDraw(); updateHash();
    });
    el.querySelector('input:not(.hl)').addEventListener('change', e => {
      e.target.checked ? hiddenCats.delete(c) : hiddenCats.add(c);
      el.classList.toggle('off', !e.target.checked);
      store.set('hidden', [...hiddenCats]); recompute(); updateHash();
    });
    box.appendChild(el);
  }
  T.catNames = names;
}
function refreshCatCounts(){
  const allocCounts = {};
  for (const id of alloc) { const n = T.nodes[id]; allocCounts[n.cat] = (allocCounts[n.cat] || 0) + 1; }
  document.querySelectorAll('#cats .cat').forEach(el => {
    const c = el.querySelector('.nm').textContent;
    el.querySelector('.a').textContent = allocCounts[c] ? allocCounts[c] + ' ✓' : '';
  });
}

// ---------- visibility ----------
// "Select a type of content" nodes whose options span several content types
function mixedCats(n){
  if (!n.vc) return null;
  const u = [...new Set(n.vc)];
  return u.length > 1 ? u : null;
}
function recompute(){
  hidden = new Set();
  for (const n of T.list) {
    if (n.cat === 'Start') continue;
    const mix = mixedCats(n);
    if (mix) { if (mix.every(c => hiddenCats.has(c))) hidden.add(n.id); continue; }   // only hide once every option's content is hidden
    if (hiddenCats.has(n.cat) || (opts.strict && n.also && n.also.some(c => hiddenCats.has(c)))) hidden.add(n.id);
  }
  if (opts.prune && hidden.size) {
    // iteratively drop generic travel nodes that became dead ends because a neighbour is hidden
    let changed = true;
    while (changed) {
      changed = false;
      for (const n of T.list) {
        if (hidden.has(n.id) || n.t === 'mastery' || n.t === 'start' || n.t === 'wormhole') continue;
        if (mixedCats(n) || !(n.cat === 'General' || (TRAVEL.has(n.cat) && n.t === 'normal'))) continue;
        const nb = adj[n.id];
        const vis = nb.filter(o => !hidden.has(o)).length;
        if (vis < nb.length && vis <= 1) { hidden.add(n.id); changed = true; }
      }
    }
  }
  // masteries follow their category
  previewPath = null;
  runSearch();
  requestDraw();
}
const isHidden = id => hidden.has(id);

// ---------- allocation ----------
const isAlloc = id => alloc.has(id) || (T.start && id === T.start.id);
function neighbours(id){ const a = adj[id].slice(); if (T.gate[id]) a.push(T.gate[id]); return a; }
function canAllocate(id){ return !isAlloc(id) && neighbours(id).some(isAlloc); }
function findPath(target){
  // BFS from every allocated node through visible, non-mastery nodes
  const prev = new Map(), q = [];
  for (const id of [T.start.id, ...alloc]) { prev.set(id, null); q.push(id); }
  for (let i = 0; i < q.length; i++) {
    const id = q[i];
    if (id === target) break;
    for (const o of neighbours(id)) {
      if (prev.has(o) || hidden.has(o) || T.nodes[o].t === 'mastery') continue;
      prev.set(o, id); q.push(o);
    }
  }
  if (!prev.has(target)) return null;
  const path = [];
  for (let id = target; id && !isAlloc(id); id = prev.get(id)) path.push(id);
  return path;
}
function reachableFromStart(set){
  const ok = new Set([T.start.id]), q = [T.start.id];
  for (let i = 0; i < q.length; i++) for (const o of neighbours(q[i])) if (set.has(o) && !ok.has(o)) { ok.add(o); q.push(o); }
  return ok;
}
function toggleNode(n){
  if (n.t === 'mastery' || n.t === 'start') return;
  if (alloc.has(n.id)) {
    alloc.delete(n.id);
    const ok = reachableFromStart(alloc);
    alloc = new Set([...alloc].filter(id => ok.has(id)));
  } else {
    if (hidden.has(n.id)) return;
    const p = findPath(n.id);
    if (!p) return toast('No visible path to that node');
    p.forEach(id => alloc.add(id));
    if (n.v) openPicker(n);
  }
  previewPath = null;
  afterAllocChange();
}
function catOf(n){ return n.vc && choices[n.id] != null ? n.vc[choices[n.id]] : n.cat; }
function setChoice(id, idx){ choices[id] = idx; closePicker(); afterAllocChange(); }
let pickPos = { x: 0, y: 0 };
function openPicker(n){
  const el = $('pick');
  el.innerHTML = `<div class="ph">${esc(n.n)}: pick one</div>` +
    n.v.map((v, i) => `<button data-i="${i}" class="${choices[n.id] === i ? 'on' : ''}">${v.map(esc).join(' / ')}</button>`).join('') +
    `<button class="later" data-i="-1">Decide later</button>`;
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; i < 0 ? closePicker() : setChoice(n.id, i); };
  el.style.display = 'block';
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(6, Math.min(pickPos.x + 14, window.innerWidth - r.width - 6)) + 'px';
  el.style.top = Math.max(46, Math.min(pickPos.y + 40, window.innerHeight - r.height - 6)) + 'px';
  $('tip').style.display = 'none';
}
function closePicker(){ $('pick').style.display = 'none'; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#pick') && e.target !== cv) closePicker(); });
function afterAllocChange(){
  const used = alloc.size, max = T.points.totalPoints;
  $('points').innerHTML = `Selected <b>${used}</b> / ${max}`;
  renderSelected();
  $('points').classList.toggle('over', used > max);
  refreshCatCounts();
  for (const id in choices) if (!alloc.has(id)) delete choices[id];
  store.set('alloc.' + treeName, [...alloc]);
  store.set('choices.' + treeName, choices);
  updateHash();
  requestDraw();
}

// ---------- drawing ----------
let drawQueued = false;
function requestDraw(){ if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); } }
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight - 40;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  requestDraw();
}
function sprite(kind, key, x, y, scaleMul = 1, alpha = 1){
  const sp = T.sprites[kind]; if (!sp) return;
  const c = sp.coords[key]; if (!c) return;
  const im = img(sp.file); if (!im.complete || !im.naturalWidth) return;
  const w = c.w / sp.scale * scaleMul, h = c.h / sp.scale * scaleMul;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(im, c.x, c.y, c.w, c.h, x - w / 2, y - h / 2, w, h);
  if (alpha !== 1) ctx.globalAlpha = 1;
}
function isMarked(n){
  if (!markCats.size) return false;
  const mix = mixedCats(n);
  if (mix) return mix.some(c => markCats.has(c));

  if (markCats.size) p.set('m', [...markCats].join('|'));
  history.replaceState(null, '', p.toString() ? '#' + p.toString() : location.pathname + location.search);
}
let hashChoices = null;
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  if (!location.hash) return false;
  if (p.get('t') && ATLAS[p.get('t')]) treeName = p.get('t');
  if (p.has('h')) hiddenCats = new Set(p.get('h').split('|').filter(Boolean));
  if (p.has('m')) markCats = new Set(p.get('m').split('|').filter(Boolean));
  if (p.has('c')) { hashChoices = {}; for (const kv of p.get('c').split('.')) { const [id, i] = kv.split('-'); if (id && i !== undefined) hashChoices[id] = +i; } }
  return p.has('n') ? p.get('n').split('.').filter(Boolean) : [];
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2200); }
$('share').onclick = async () => {
  updateHash();
  try { await navigator.clipboard.writeText(location.href); toast('Link copied'); }
  catch { prompt('Copy this link:', location.href); }
};
$('exp').onclick = () => {
  const data = { name: `Atlas ${alloc.size}Pts`, author: 'Atlas Tree Filter', ascendancy: '',
                 passives: [...alloc].map(Number), inventory_slots: [], skills: [] };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `Atlas ${alloc.size}Pts.build`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('imp').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const ids = (d.passives || d.nodes || []).map(String).filter(id => T.nodes[id] && T.nodes[id].t !== 'mastery' && T.nodes[id].t !== 'start');
    alloc = new Set(ids); afterAllocChange();
    toast(`Imported ${ids.length} node${ids.length === 1 ? '' : 's'}`);
  } catch (err) { toast('Could not read that file'); }
  e.target.value = '';
};

window.__atlas = { get T(){ return T; }, get hidden(){ return hidden; }, get alloc(){ return alloc; }, toggleNode, findPath, cam };

// ---------- boot ----------
resize();
const fromHash = readHash();
loadTree(treeName);
alloc = new Set((fromHash && fromHash.length ? fromHash : store.get('alloc.' + treeName) || []).filter(id => T.nodes[id]));
choices = (fromHash && fromHash.length ? hashChoices : store.get('choices.' + treeName)) || {};
afterAllocChange();
fit();
})();
</script>
